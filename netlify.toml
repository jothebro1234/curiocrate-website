[build]
  command = "npm run build"
  publish = "dist"

# Purges Cloudflare's cache right after every deploy goes live — see
# netlify/plugins/cloudflare-purge/index.js for why this exists (prevents a
# newly-deployed asset URL from getting permanently cached with a broken
# response during Netlify's post-deploy propagation window).
[[plugins]]
  package = "./netlify/plugins/cloudflare-purge"
